name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.22.1
          cache: npm
      - name: Pin npm
        run: npm install --global npm@10.9.4 && test "$(npm --version)" = "10.9.4"
      - name: Fetch complete source refs
        run: git fetch --force origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*' && test "$(git rev-parse --is-shallow-repository)" = false
      - name: Install pinned secret scanner
        run: tools/install-gitleaks.sh "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: Exact clean-clone source acceptance
        run: tools/fresh-clone-acceptance.sh --mode=source --source-sha "$GITHUB_SHA"

  quality-ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.22.1
          cache: npm
      - name: Pin npm
        run: npm install --global npm@10.9.4 && test "$(npm --version)" = "10.9.4"
      - name: Fetch complete source refs
        run: git fetch --force origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*' && test "$(git rev-parse --is-shallow-repository)" = false
      - name: Install pinned secret scanner
        run: tools/install-gitleaks.sh "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: Exact clean-clone source acceptance
        run: tools/fresh-clone-acceptance.sh --mode=source --source-sha "$GITHUB_SHA"
